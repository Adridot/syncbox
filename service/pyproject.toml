[project]
name = "syncbox-service"
version = "0.1.0"
description = "Local API service for Syncbox — DJ playlist sync for Rekordbox."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "mutagen>=1.47.0",
  "pydantic>=2.9.0",
  "pyrekordbox>=0.4.4",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
