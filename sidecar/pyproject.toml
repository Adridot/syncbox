# No build backend: tests import through pytest's pythonpath and PyInstaller
# resolves the package through the spec's pathex. Packaging tools remain in
# the development dependency group, never in the runtime bundle graph.
[project]
name = "syncbox"
# Pinned to ui/package.json (the canonical version source, 6.11) by
# tests/test_version_single_source.py.
version = "0.7.1"
description = "Syncbox sidecar - lawful Rekordbox collection maintenance for DJs"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pyrekordbox",
    "sqlcipher3-wheels",
    "sqlalchemy",
    "rapidfuzz",
    "mutagen",
    "send2trash",
    "psutil",
    "numpy",
    "miniaudio",
    "starlette",
    "sse-starlette",
    "uvicorn",
    # Direct, not transitive (3.4/3.5): the CA bundle spotify.py pins its SSL
    # context to must never vanish on a dependency bump.
    "certifi",
]

[dependency-groups]
dev = ["httpx2", "pyinstaller>=6.21", "pytest"]

[tool.uv.sources]
sqlcipher3-wheels = { path = "vendor/sqlcipher3-commoncrypto" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
