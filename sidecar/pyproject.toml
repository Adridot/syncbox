# ponytail: no build backend — tests import via pytest pythonpath, and the M5
# freeze resolves the package via the spec's pathex (sidecar.spec). PyInstaller
# is a dev-only tool (dependency-groups), never a runtime dependency.
[project]
name = "syncbox"
# Pinned to ui/package.json (the canonical version source, 6.11) by
# tests/test_version_single_source.py.
version = "0.1.0"
description = "Syncbox sidecar - lawful Rekordbox collection maintenance for DJs"
requires-python = ">=3.14"
dependencies = [
    "pyrekordbox",
    "sqlcipher3-wheels",
    "sqlalchemy",
    "rapidfuzz",
    "mutagen",
    "psutil",
    "numpy",
    "miniaudio",
    "starlette",
    "sse-starlette",
    "uvicorn",
]

[dependency-groups]
dev = ["pyinstaller>=6.21"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
