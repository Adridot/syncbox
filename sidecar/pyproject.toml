# ponytail: no build backend yet — tests import via pytest pythonpath; packaging
# machinery (and single-source version wiring) lands at M5 with PyInstaller.
[project]
name = "syncbox"
version = "0.0.1"
description = "Syncbox sidecar - lawful Rekordbox collection maintenance for DJs"
requires-python = ">=3.14"
dependencies = [
    "pyrekordbox",
    "sqlcipher3-wheels",
    "sqlalchemy",
    "rapidfuzz",
    "mutagen",
    "psutil",
    "numpy",
    "miniaudio",
    "starlette",
    "sse-starlette",
    "uvicorn",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
