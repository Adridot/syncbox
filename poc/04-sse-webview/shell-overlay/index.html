<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>POC #4 SSE in WKWebView</title>
  </head>
  <body>
    <pre id="log">POC #4 running...</pre>
    <script>
      // POC #4 test page. Runs 4 phases sequentially, all fully automated:
      //  A  EventSource -> compiled PyInstaller sidecar :8899/sse (NO CORS headers on the
      //     response). Measures what the current SPEC-UNIFIED 6.3 posture (no tauri://
      //     origin in the allowlist -> no ACAO for this page) does to EventSource.
      //  B1 EventSource -> venv app :8897/sse (CORS ok, 3 ticks 400 ms apart).
      //     THE incremental-delivery probe (WebKit initial-buffering quirk).
      //  B2 same with a 2 KB ':' comment preamble (padding workaround probe).
      //  C  EventSource -> :8897/sse-long; after 2 ticks we POST a marker, the
      //     orchestrator SIGKILLs the server, we must see a prompt 'error' event.
      // Finally POSTs everything to the results server :8898/result.
      const RESULTS = "http://127.0.0.1:8898";
      const t0 = performance.now();
      const now = () => Math.round((performance.now() - t0) * 10) / 10; // ms since page start
      const result = {
        page_origin: location.origin,
        href: location.href,
        user_agent: navigator.userAgent,
        is_secure_context: self.isSecureContext,
        started_epoch_ms: Date.now(), // maps 't' (ms since start) to wall clock
        phases: {},
      };
      const logEl = document.getElementById("log");
      const log = (s) => (logEl.textContent += "\n" + s);

      function post(path, obj) {
        // text/plain keeps it a CORS "simple request" (no preflight dependency);
        // the results server answers CORS anyway. Origin header still sent + logged.
        return fetch(RESULTS + path, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(obj),
        }).catch((e) => log("post fail " + e));
      }

      function runPhase(name, url, opts) {
        return new Promise((resolve) => {
          const ph = { url, events: [], states: [], done_reason: null };
          result.phases[name] = ph;
          let es = null;
          const finish = (reason) => {
            if (ph.done_reason) return;
            ph.done_reason = reason;
            ph.state_at_end = es ? es.readyState : null;
            try { if (es) es.close(); } catch (e) {}
            ph.state_after_close = es ? es.readyState : null;
            log(name + " done: " + reason);
            resolve(ph);
          };
          const timer = setTimeout(() => finish("timeout"), opts.timeoutMs);
          try {
            es = new EventSource(url);
          } catch (e) {
            ph.events.push({ t: now(), type: "constructor_throw", detail: String(e) });
            clearTimeout(timer);
            return finish("constructor_throw");
          }
          ph.states.push({ t: now(), readyState: es.readyState, at: "constructed" });
          es.onopen = () => ph.states.push({ t: now(), readyState: es.readyState, at: "open" });
          es.onerror = () => {
            ph.events.push({ t: now(), type: "error", readyState: es.readyState });
            if (opts.endOnError) { clearTimeout(timer); finish("error"); }
          };
          let n = 0;
          es.addEventListener("tick", (ev) => {
            n += 1;
            ph.events.push({ t: now(), type: "tick", data: ev.data, readyState: es.readyState, n });
            if (opts.markerAfter && n === opts.markerAfter)
              post("/marker", { phase: name, streaming_ok: true, n, t: now() });
            if (opts.closeAfter && n >= opts.closeAfter) { clearTimeout(timer); finish("got_all"); }
          });
        });
      }

      (async () => {
        await runPhase("A_no_cors_sidecar", "http://127.0.0.1:8899/sse",
          { closeAfter: 3, timeoutMs: 5000, endOnError: true });
        await runPhase("B1_cors_plain", "http://127.0.0.1:8897/sse",
          { closeAfter: 3, timeoutMs: 8000 });
        await runPhase("B2_cors_padded", "http://127.0.0.1:8897/sse-padded",
          { closeAfter: 3, timeoutMs: 8000 });
        await runPhase("C_kill_midstream", "http://127.0.0.1:8897/sse-long",
          { markerAfter: 2, timeoutMs: 20000, endOnError: true });
        result.finished_epoch_ms = Date.now();
        await post("/result", result);
        log("ALL DONE");
      })();
    </script>
  </body>
</html>
