name: Release Pin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-pin.yml"
      - "optional-component/**"
      - "web-audio-component/**"
      - "sidecar/src/syncbox/web_audio_component.json"
      - "pnpm-lock.yaml"
      - "release/**"
      - "release-build.json"
      - "rust-toolchain.toml"
      - "scripts/**"
      - "shell/package.json"
      - "sidecar/pyproject.toml"
      - "sidecar/src/syncbox/optional_component.json"
      - "sidecar/uv.lock"
      - "ui/package.json"

permissions:
  contents: read

concurrency:
  group: release-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-manifest:
    name: component manifest
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read toolchain pins
        id: pins
        run: |
          {
            echo "node=$(jq -r .toolchain.node release-build.json | sed 's/^v//')"
            echo "pnpm=$(jq -r .toolchain.pnpm release-build.json)"
            echo "uv=$(jq -r .toolchain.uv release-build.json | awk '{print $2}')"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ steps.pins.outputs.uv }}

      - name: Install locked dependencies
        run: |
          rustup toolchain install
          pnpm install --frozen-lockfile
          (cd sidecar && uv lock --check && uv sync --locked --managed-python)
          (cd optional-component && uv lock --check && uv sync --locked --managed-python)
          (cd web-audio-component && uv lock --check && uv sync --locked --managed-python)
          rm -rf sidecar/vendor/sqlcipher3-commoncrypto/build \
                 sidecar/vendor/sqlcipher3-commoncrypto/sqlcipher3_wheels.egg-info

      - name: Build the hosted-runner web-audio manifest
        run: |
          export SOURCE_DATE_EPOCH="$(jq -r .source_date_epoch release-build.json)"
          uv run --project web-audio-component --locked --managed-python python scripts/build_web_audio_native.py
          uv run --project web-audio-component --locked --managed-python python scripts/package_web_audio_component.py

      - name: Build the hosted-runner component manifest
        working-directory: shell
        env:
          SYNCBOX_RELEASE_HOST_TOOLCHAIN: unpinned
        run: pnpm bundle:macos --component-only

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-audio-component-archive
          path: web-audio-component/dist/*.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: optional-component-manifest
          path: sidecar/src/syncbox/optional_component.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-audio-component-manifest
          path: sidecar/src/syncbox/web_audio_component.json
          if-no-files-found: error
          retention-days: 7

      - name: Check the committed component pin
        run: |
          MANIFESTS=(sidecar/src/syncbox/optional_component.json sidecar/src/syncbox/web_audio_component.json)
          if git diff --quiet -- "${MANIFESTS[@]}"; then
            echo "The committed component manifests match this hosted runner."
            exit 0
          fi

          git diff -- "${MANIFESTS[@]}"
          {
            echo "## Component manifest refresh required"
            echo
            echo "Download both component manifest artifacts from run \`$GITHUB_RUN_ID\`,"
            echo "replace the corresponding manifests, commit them, and rerun this check before tagging."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::error::Commit the hosted-runner manifest artifact before merging this release PR."
            exit 1
          fi

          echo "Preparation complete. Download and commit the manifest artifact before opening the release PR."
